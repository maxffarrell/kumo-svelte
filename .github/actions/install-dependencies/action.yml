name: "Install Dependencies"
description: "Install pnpm, Node.js, and project dependencies"

inputs:
  filter:
    description: "Optional pnpm --filter value to scope install. Omit for the root package."
    required: false

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 26
        cache: "pnpm"
        registry-url: "https://registry.npmjs.org"

    - name: Cache node_modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: "**/node_modules"
        key: ${{ runner.os }}-${{ runner.arch }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node_modules-

    - name: Install dependencies
      shell: bash
      env:
        PNPM_FILTER: ${{ inputs.filter }}
      run: |
        if [ -n "$PNPM_FILTER" ]; then
          pnpm install --frozen-lockfile --filter "$PNPM_FILTER"
        else
          pnpm install --frozen-lockfile
        fi
