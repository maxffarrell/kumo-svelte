name: "Install Dependencies"
description: "Install pnpm, Node.js, and project dependencies"

inputs:
  filter:
    description: "Optional pnpm --filter value to scope install. Omit for the root package."
    required: false

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "26.13.1"
        cache: "pnpm"
        registry-url: "https://registry.npmjs.org"

    - name: Cache node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: "**/node_modules"
        key: ${{ runner.os }}-${{ runner.arch }}-node26.12.1-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node26.12.1-node_modules-

    - name: Install dependencies
      shell: bash
      env:
        PNPM_FILTER: ${{ inputs.filter }}
      run: |
        if [ -n "$PNPM_FILTER" ]; then
          pnpm install --frozen-lockfile --filter "$PNPM_FILTER"
        else
          pnpm install --frozen-lockfile
        fi
