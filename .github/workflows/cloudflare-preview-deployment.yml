name: Cloudflare Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Register preview deployment
        uses: actions/github-script@v8
        env:
          WORKER_NAME: kumo-svelte
          WORKERS_SUBDOMAIN: maxfarrell
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');
            const worker = process.env.WORKER_NAME;
            const subdomain = process.env.WORKERS_SUBDOMAIN;
            const environmentUrl = `https://${branch}-${worker}.${subdomain}.workers.dev`;
            const environment = `preview-${context.payload.pull_request.number}`;
            const { owner, repo } = context.repo;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              auto_merge: false,
              required_contexts: [],
              environment,
              transient_environment: true,
              production_environment: false,
              description: 'Cloudflare Workers preview deployment',
            });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment,
              environment_url: environmentUrl,
              log_url: environmentUrl,
              description: 'Cloudflare Workers preview URL',
            });
