name: Cloudflare Preview URL

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Comment preview URL
        uses: actions/github-script@v8
        env:
          WORKER_NAME: kumo-svelte
          WORKERS_SUBDOMAIN: maxfarrell
        with:
          script: |
            const marker = '<!-- kumo-svelte-cloudflare-preview -->';
            const branch = context.payload.pull_request.head.ref
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');
            const worker = process.env.WORKER_NAME;
            const subdomain = process.env.WORKERS_SUBDOMAIN;
            const previewUrl = `https://${branch}-${worker}.${subdomain}.workers.dev`;
            const body = [
              marker,
              '## Cloudflare preview',
              '',
              `[View preview deployment](${previewUrl})`,
              '',
              '_Cloudflare may take a minute to finish deploying the latest commit._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
