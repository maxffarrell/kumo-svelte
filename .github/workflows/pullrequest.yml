name: Pull Request

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - ".changeset/**"
  # Also trigger on push to PR branches (for bots that push via API)
  push:
    branches:
      - "opencode/**"
    paths-ignore:
      - "*.md"
      - ".changeset/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    timeout-minutes: 2
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - name: Test changeset validation
        run: pnpm tsx --test ci/utils/git-operations.test.ts
      - run: pnpm tsx ci/scripts/validate-kumo-svelte-changeset.ts

  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build:package && pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kumo-svelte-dist
          path: |
            packages/kumo-svelte/dist
            packages/kumo-svelte/ai
            packages/kumo-svelte/.svelte-kit/cloudflare
          retention-days: 1

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - run: pnpm lint

  typecheck:
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      - run: pnpm typecheck

  test:
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/install-dependencies
      # The tools tests do not share Vitest's SvelteKit generated state.
      - parallel:
          - name: Test package
            run: pnpm --filter kumo-svelte test
          - name: Test deployment tools
            run: pnpm test:tools
