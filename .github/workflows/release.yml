name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build kumo-svelte
        run: pnpm build:package

      # changesets/action either:
      # 1. Creates/updates a "Version Packages" PR (when changesets exist)
      # 2. Publishes to npm via `pnpm run release` (when Version Packages PR merges)
      # Note: `pnpm run release` runs `pnpm build:package && changeset publish`,
      # which rebuilds kumo-svelte package artifacts (redundant but harmless). If this becomes slow,
      # consider a publish-only script.
      - name: Create Version PR or Publish to npm
        id: changesets
        # v2 is required for @changesets/cli v3. The v1 action relies on the
        # Changesets v2 publish output and can publish successfully without
        # detecting the package, pushing its tag, or creating its release.
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version
          publish-script: pnpm run release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true

      # Publish pkg-pr-new preview for Version Packages PR
      # (GITHUB_TOKEN PRs don't trigger workflows, so we do it here)
      - name: Publish package preview
        if: ${{ steps.changesets.outputs.pr-number }}
        continue-on-error: true
        run: pnpm dlx pkg-pr-new publish --pnpm --compact --no-template ./packages/kumo-svelte
