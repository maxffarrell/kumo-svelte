name: Semgrep OSS scan
on:
  pull_request: {}
  push:
    branches: [main, master]
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 1-7 * 6' # per-repo, staggered across month
concurrency:
  group: semgrep-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep-oss
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install semgrep==1.160.0
      - run: '"$RUNNER_TEMP/semgrep/bin/semgrep" scan --config=auto'
